<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIKO | ATELIER NEURAL V19 - THE PERFECT MIRROR (AR)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/ARButton.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/webgazer.js/0.9.0/webgazer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.4.1633559310/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1633559310/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.4.1633559310/drawing_utils.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Orbitron', sans-serif; 
            touch-action: none; 
        }
        
        #canvas { display: block; }
        
        #hud { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #00f2ff; 
            pointer-events: auto; 
            border-left: 2px solid #00f2ff; 
            padding-left: 15px; 
            z-index: 10; 
            text-shadow: 0 0 5px rgba(0, 242, 255, 0.8);
        }
        
        .stat { 
            font-size: max(10px, 1vw); 
            margin-bottom: 5px; 
            letter-spacing: 2px; 
        }
        
        .hud-btn { 
            cursor: pointer; 
            opacity: 0.8; 
            transition: 0.2s; 
            margin-top: 10px; 
            display: inline-block; 
        }
        
        .hud-btn:hover { 
            opacity: 1; 
            text-shadow: 0 0 8px #00f2ff; 
        }
        
        #ai-terminal { 
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 80%; 
            max-width: 800px; 
            z-index: 20; 
            background: rgba(0, 15, 20, 0.6); 
            border: 1px solid #00f2ff;
            padding: 15px;
            border-radius: 5px;
        }
        
        #chat-log { 
            color: #00f2ff; 
            font-size: 14px; 
            min-height: 20px; 
            max-height: 100px; 
            overflow-y: auto; 
            text-shadow: 0 0 5px #00f2ff; 
            line-height: 1.4; 
        }
        
        #auth-panel { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0, 15, 20, 0.95); 
            border: 2px solid #ffaa00; 
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
            padding: 30px;
            border-radius: 10px;
            z-index: 100;
            min-width: 300px;
        }
        
        #auth-panel h2 { 
            color: #ffaa00; 
            margin: 0 0 20px 0; 
            font-size: 18px; 
            letter-spacing: 3px; 
        }
        
        #api-key-input { 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid #00f2ff; 
            color: #00f2ff; 
            padding: 12px; 
            font-family: 'Orbitron', sans-serif; 
            outline: none; 
            text-align: center; 
            letter-spacing: 1px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        
        #auth-btn { 
            background: #00f2ff; 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            letter-spacing: 2px;
            width: 100%;
        }
        
        #auth-btn:hover { 
            background: #fff; 
            box-shadow: 0 0 20px #00f2ff; 
        }
        
        .color-indicator { 
            display: inline-block; 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            margin-left: 5px; 
            box-shadow: 0 0 8px currentColor; 
        }
        
        #interaction-layer { 
            position: absolute; 
            top:0; 
            left:0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
        }
        
        .input_video { 
            display: none; 
        }
        
        #webgazerVideoFeed {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="interaction-layer"></div>
    <video class="input_video"></video>

    <div id="auth-panel">
        <h2>> OMNI-MATRICE ENCRYPTED</h2>
        <div style="color: #00f2ff; font-size: 12px; margin-bottom: 10px;">ENTER MISTRAL API KEY</div>
        <input type="password" id="api-key-input" placeholder="sk-..." autocomplete="off" />
        <button id="auth-btn">AUTHORIZE</button>
        <div style="color: #ff0055; font-size: 10px; margin-top: 15px; text-align: center;">Camera permissions required</div>
    </div>

    <div id="hud">
        <div class="stat">OPERATOR: NIKO</div>
        <div class="stat" id="status">STATUS: STANDBY</div>
        <div class="stat">BRUSH COLOR: <span id="brush-color-text" style="color:#00f2ff;">CYAN</span><span class="color-indicator" id="brush-color-dot" style="background-color:#00f2ff; color:#00f2ff;"></span></div>
        <div class="stat" id="hand-status">HANDS: OFFLINE</div>
        <div class="stat" id="stroke-count">STROKES: 0</div>
        <div class="stat hud-btn" id="voice-btn">[ VOICE LINK : OFF ]</div><br>
        <div class="stat hud-btn" id="clear-paint-btn">[ CLEAR CANVAS ]</div><br>
        <div class="stat hud-btn" id="export-btn" style="color:#ffaa00;">[ EXPORT TO 3D FILE ]</div><br>
        <div id="ar-container" style="margin-top: 10px;"></div>
        <div class="stat" id="reset-key-btn" style="cursor:pointer; font-size:10px; color:#ff0055; margin-top:10px;">[ PURGE API KEY ]</div>
    </div>

    <div id="ai-terminal">
        <div id="chat-log">> WAITING FOR SECURE LINK...</div>
    </div>

    <script id="vShader" type="x-shader/x-vertex">
        uniform float uTime; uniform float uAudio; varying vec3 vColor;
        void main() {
            vec3 pos = position; float angle = uTime * 0.2 + length(pos.xz) * 0.05;
            float s = sin(angle); float c = cos(angle); pos.xz *= mat2(c, -s, s, c);
            pos.y += sin(uTime + pos.x) * uAudio * 3.0;
            vColor = vec3(0.0, 0.3, 0.4); 
            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (2.0 + uAudio * 2.0) * (200.0 / -mvPos.z);
            gl_Position = projectionMatrix * mvPos;
        }
    </script>
    <script id="fShader" type="x-shader/x-fragment">
        varying vec3 vColor; void main() { if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard; gl_FragColor = vec4(vColor, 0.4); }
    </script>

    <script>
        let scene, camera, renderer, backgroundVortex, paintGroup;
        let currentBrushColorHex = 0x00f2ff;
        let isPinching = false;
        let handsTrackingActive = false;
        let gazeTarget = { x: 0, y: 0 };
        let strokeCount = 0;
        
        const colorDictionary = {
            'rose': 0xff00ff, 'rouge': 0xff0000, 'bleu': 0x0088ff, 'vert': 0x00ff00,
            'jaune': 0xffff00, 'violet': 0xbd00ff, 'orange': 0xffaa00, 'blanc': 0xffffff,
            'cyan': 0x00f2ff, 'or': 0xffd700, 'magenta': 0xff00aa
        };

        function initThree() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 50;
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: false, 
                preserveDrawingBuffer: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // AR Button
            try {
                const arButton = ARButton.createButton(renderer, { 
                    requiredFeatures: ['hit-test'],
                    optionalFeatures: ['dom-overlay', 'dom-overlay-for-handheld-ar'],
                    domOverlay: { root: document.body }
                });
                arButton.style.position = 'relative';
                arButton.style.bottom = 'auto';
                arButton.style.fontFamily = 'Orbitron';
                arButton.style.backgroundColor = 'transparent';
                arButton.style.color = '#bd00ff';
                arButton.style.border = '1px solid #bd00ff';
                arButton.innerText = "[ INVERT MATRIX (AR) ]";
                document.getElementById('ar-container').appendChild(arButton);
            } catch(e) {
                console.log("AR not available:", e);
            }

            // Background vortex
            const geo = new THREE.BufferGeometry(); 
            const pos = new Float32Array(15000);
            for(let i=0; i<15000; i++) pos[i] = (Math.random()-0.5) * 150;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: {value: 0}, uAudio: {value: 0} },
                vertexShader: document.getElementById('vShader').textContent, 
                fragmentShader: document.getElementById('fShader').textContent,
                transparent: true, 
                blending: THREE.AdditiveBlending, 
                depthTest: false
            });
            backgroundVortex = new THREE.Points(geo, mat); 
            scene.add(backgroundVortex);

            paintGroup = new THREE.Group();
            scene.add(paintGroup);

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animateThree);
            
            document.getElementById('status').innerText = "STATUS: READY";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        }

        function animateThree(t) {
            backgroundVortex.material.uniforms.uTime.value = (t || 0) * 0.001;
            
            if (!renderer.xr.isPresenting) {
                backgroundVortex.visible = true;
                gsap.to(backgroundVortex.rotation, { 
                    x: gazeTarget.y * 0.3, 
                    y: gazeTarget.x * 0.3, 
                    duration: 1.0 
                });
                gsap.to(paintGroup.rotation, { 
                    x: gazeTarget.y * -0.1, 
                    y: gazeTarget.x * -0.1, 
                    duration: 1.5 
                });
            } else {
                backgroundVortex.visible = false;
                paintGroup.position.set(0, 0, -50); 
                paintGroup.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }

        function initOptics() {
            document.getElementById('status').innerText = "STATUS: INITIALIZING BIOSENSORS...";
            initHands();
        }

        // MediaPipe Hands Setup
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.createElement('canvas');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1633559310/${file}`
        });
        
        hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.7, 
            minTrackingConfidence: 0.7 
        });
        
        hands.onResults((results) => {
            if (renderer.xr.isPresenting) return;
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handsTrackingActive = true;
                document.getElementById('hand-status').innerText = "HANDS: ACTIVE";
                
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                const distance = Math.sqrt(
                    Math.pow(indexTip.x - thumbTip.x, 2) + 
                    Math.pow(indexTip.y - thumbTip.y, 2)
                );
                
                if (distance < 0.05) {
                    if (!isPinching) isPinching = true;
                    drawPaintStroke(indexTip.x, indexTip.y);
                } else { 
                    isPinching = false; 
                }
            } else {
                handsTrackingActive = false;
                document.getElementById('hand-status').innerText = "HANDS: OFFLINE";
                isPinching = false;
            }
        });

        async function initHands() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    processHandsFrame();
                    document.getElementById('status').innerText = "STATUS: FULL BIO-SYNC (HANDS)";
                };
            } catch (e) {
                console.error("Camera error:", e);
                document.getElementById('hand-status').innerText = "HANDS: CAMERA ERROR";
                document.getElementById('status').innerText = "STATUS: CAMERA ACCESS DENIED";
            }
        }

        async function processHandsFrame() {
            if (!videoElement.paused && videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                await hands.send({ image: videoElement });
            }
            requestAnimationFrame(processHandsFrame);
        }

        function drawPaintStroke(x, y) {
            const vector = new THREE.Vector3(
                (x * 2) - 1, 
                -(y * 2) + 1, 
                0.5
            );
            
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            
            if (Math.abs(dir.z) > 0.001) {
                const distance = -camera.position.z / dir.z;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));

                const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                const material = new THREE.MeshBasicMaterial({ 
                    color: currentBrushColorHex, 
                    transparent: true, 
                    opacity: 0.8, 
                    blending: THREE.AdditiveBlending 
                });
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.copy(pos);
                mesh.position.applyMatrix4(
                    new THREE.Matrix4()
                        .copy(paintGroup.matrixWorld)
                        .invert()
                );
                
                mesh.rotation.set(
                    Math.random() * Math.PI, 
                    Math.random() * Math.PI, 
                    0
                );
                
                paintGroup.add(mesh);
                strokeCount++;
                document.getElementById('stroke-count').innerText = `STROKES: ${strokeCount}`;
            }
        }

        // Voice Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition; 
        let isVoiceMode = false;
        
        function setBrushColor(hex, name) {
            currentBrushColorHex = hex;
            document.getElementById('brush-color-text').innerText = name.toUpperCase();
            document.getElementById('brush-color-text').style.color = '#' + hex.toString(16).padStart(6, '0');
            document.getElementById('brush-color-dot').style.backgroundColor = '#' + hex.toString(16).padStart(6, '0');
            document.getElementById('brush-color-dot').style.color = '#' + hex.toString(16).padStart(6, '0');
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            
            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                let colorChanged = false;
                
                for (const [colorName, hexValue] of Object.entries(colorDictionary)) {
                    if (transcript.includes(colorName)) { 
                        setBrushColor(hexValue, colorName); 
                        colorChanged = true; 
                        break; 
                    }
                }
                
                if (transcript.includes('efface')) { 
                    document.getElementById('clear-paint-btn').click(); 
                    colorChanged = true; 
                }
                if (transcript.includes('exporte')) { 
                    document.getElementById('export-btn').click(); 
                    colorChanged = true; 
                }

                if (!colorChanged && mistralApiKey) {
                    askMistral(transcript);
                }
            };
        }

        document.getElementById('voice-btn').addEventListener('click', function() {
            if (!recognition) return;
            isVoiceMode = !isVoiceMode;
            if (isVoiceMode) { 
                this.innerText = "[ VOICE LINK : ON ]"; 
                this.style.color = "#ffaa00"; 
                try { recognition.start(); } catch(e){}
            } else { 
                this.innerText = "[ VOICE LINK : OFF ]"; 
                this.style.color = "#00f2ff"; 
                recognition.stop(); 
            }
        });

        document.getElementById('clear-paint-btn').addEventListener('click', () => {
            while(paintGroup.children.length > 0){ 
                let child = paintGroup.children[0];
                paintGroup.remove(child); 
                child.geometry.dispose(); 
                child.material.dispose();
            }
            strokeCount = 0;
            document.getElementById('stroke-count').innerText = "STROKES: 0";
            updateTerminalMsg("> SYSTEM: CANVAS CLEARED.");
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if (paintGroup.children.length === 0) {
                return updateTerminalMsg("> SYSTEM: CANVAS IS EMPTY.");
            }
            
            updateTerminalMsg("> SYSTEM: INITIATING 3D MESH EXPORT...");
            const exporter = new THREE.GLTFExporter();
            
            exporter.parse(paintGroup, function (gltf) {
                const output = JSON.stringify(gltf, null, 2);
                const blob = new Blob([output], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a'); 
                link.href = url; 
                link.download = 'Niko_Artwork_' + new Date().getTime() + '.gltf';
                document.body.appendChild(link); 
                link.click(); 
                document.body.removeChild(link); 
                URL.revokeObjectURL(url);
                
                updateTerminalMsg("> SYSTEM: EXPORT COMPLETE.");
                if (mistralApiKey) {
                    askMistral("Je viens d'exporter ma peinture holographique. Fais un bref commentaire.");
                }
            }, { binary: false });
        });

        // API Key Management
        let mistralApiKey = localStorage.getItem('niko_mistral_key') || "";
        const authPanel = document.getElementById('auth-panel');
        const apiKeyInput = document.getElementById('api-key-input');
        const authBtn = document.getElementById('auth-btn');
        const chatLog = document.getElementById('chat-log');
        
        function updateTerminalMsg(htmlContent) { 
            chatLog.innerHTML = htmlContent; 
            chatLog.scrollTop = chatLog.scrollHeight; 
        }

        if (mistralApiKey) { 
            authPanel.style.display = 'none'; 
            updateTerminalMsg("> MATRICE SECURED."); 
            initOptics(); 
        }

        authBtn.addEventListener('click', () => {
            if (apiKeyInput.value.trim()) {
                mistralApiKey = apiKeyInput.value.trim(); 
                localStorage.setItem('niko_mistral_key', mistralApiKey);
                authPanel.style.display = 'none'; 
                updateTerminalMsg("> MATRICE SECURED."); 
                initOptics();
            }
        });

        document.getElementById('reset-key-btn').addEventListener('click', () => { 
            localStorage.removeItem('niko_mistral_key'); 
            location.reload(); 
        });

        async function askMistral(prompt) {
            updateTerminalMsg(`> NIKO: ${prompt}<br>> SYMBIOTE: <span style="color:#ffaa00;">THINKING...</span>`);
            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST', 
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${mistralApiKey}` 
                    },
                    body: JSON.stringify({
                        model: "mistral-small-latest",
                        messages: [
                            {
                                role: "system", 
                                content: "Tu es le Symbiote de l'Atelier Neural de l'artiste Niko. Nous sommes en 2026. L'utilisateur peint en 3D avec sa main. Réponds de manière poétique et mystérieuse en 1-2 phrases. Fais référence à son art holographique."
                            },
                            {role: "user", content: prompt}
                        ]
                    })
                });
                
                if (!response.ok) { 
                    const errData = await response.json().catch(() => ({})); 
                    throw new Error(`API ${response.status}: ${errData.message || 'Clé invalide.'}`); 
                }
                
                const reply = (await response.json()).choices[0].message.content;
                updateTerminalMsg(`> NIKO: ${prompt}<br>> SYMBIOTE: ${reply}`);
                
                if (window.speechSynthesis) {
                    const u = new SpeechSynthesisUtterance(reply.replace(/[*_~`#]/g, '')); 
                    u.lang = 'fr-FR'; 
                    u.pitch = 0.8; 
                    u.rate = 1.05; 
                    window.speechSynthesis.speak(u);
                }
            } catch(e) { 
                updateTerminalMsg(`> SYMBIOTE: <span style="color:red;">LINK SEVERED. Reason: ${e.message}</span>`); 
            }
        }

        // Mouse fallback
        document.getElementById('interaction-layer').addEventListener('mousemove', (e) => {
            if(!handsTrackingActive) { 
                gazeTarget.x = ((e.clientX / window.innerWidth) * 2 - 1); 
                gazeTarget.y = -((e.clientY / window.innerHeight) * 2 - 1); 
            }
        });

        // Touch support
        document.getElementById('interaction-layer').addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                drawPaintStroke(touch.clientX / window.innerWidth, touch.clientY / window.innerHeight);
            }
        });

        initThree();
    </script>
</body>
</html>
