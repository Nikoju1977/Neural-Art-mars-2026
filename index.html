<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIKO | ATELIER NEURAL V13 - KINETIC BRUSH</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; touch-action: none; }
        #hud { position: absolute; top: 20px; left: 20px; color: #00f2ff; pointer-events: auto; border-left: 2px solid #00f2ff; padding-left: 15px; z-index: 10; text-shadow: 0 0 5px rgba(0, 242, 255, 0.5); }
        .stat { font-size: max(10px, 1vw); margin-bottom: 5px; letter-spacing: 2px; }
        .hud-btn { cursor: pointer; opacity: 0.8; transition: 0.2s; margin-top: 10px; display: inline-block; }
        .hud-btn:hover { opacity: 1; text-shadow: 0 0 8px #00f2ff; }
        #ai-terminal { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 800px; z-index: 20; background: rgba(0, 15, 20, 0.6); border: 1px solid #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); border-radius: 4px; padding: 15px; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(5px); pointer-events: none;}
        #chat-log { color: #00f2ff; font-size: 14px; min-height: 20px; max-height: 100px; overflow-y: auto; text-shadow: 0 0 5px #00f2ff; line-height: 1.4; }
        #auth-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 15, 20, 0.85); border: 1px solid #ffaa00; box-shadow: 0 0 30px rgba(255, 170, 0, 0.2); border-radius: 4px; padding: 40px; z-index: 1000; display: flex; flex-direction: column; gap: 20px; text-align: center; backdrop-filter: blur(15px); }
        #auth-panel h2 { color: #ffaa00; margin: 0; font-size: 18px; letter-spacing: 3px; }
        #api-key-input { background: rgba(0, 0, 0, 0.6); border: 1px solid #00f2ff; color: #00f2ff; padding: 12px; font-family: 'Orbitron', sans-serif; outline: none; text-align: center; letter-spacing: 2px; }
        #auth-btn { background: #00f2ff; color: #000; border: none; padding: 12px; font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 2px; }
        #auth-btn:hover { background: #fff; box-shadow: 0 0 20px #00f2ff; }
        .color-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 5px; box-shadow: 0 0 8px currentColor; }
        
        /* Vidéo cachée pour MediaPipe */
        .input_video { display: none; } 
    </style>
</head>
<body>

    <video class="input_video"></video>

    <div id="auth-panel">
        <h2>> SYMBIOTE ENCRYPTED</h2>
        <div style="color: #00f2ff; font-size: 12px; margin-bottom: 10px;">ENTER MISTRAL API KEY</div>
        <input type="password" id="api-key-input" placeholder="sk-..." autocomplete="off" />
        <button id="auth-btn">AUTHORIZE</button>
    </div>

    <div id="hud">
        <div class="stat">OPERATOR: NIKO</div>
        <div class="stat" id="status">STATUS: INITIALIZING OPTICS...</div>
        <div class="stat">BRUSH COLOR: <span id="brush-color-text" style="color:#00f2ff;">CYAN</span><span class="color-indicator" id="brush-color-dot" style="background-color:#00f2ff; color:#00f2ff;"></span></div>
        <div class="stat hud-btn" id="voice-btn">[ VOICE LINK : OFF ]</div><br>
        <div class="stat hud-btn" id="clear-paint-btn">[ CLEAR CANVAS ]</div><br>
        <div class="stat" id="reset-key-btn" style="cursor:pointer; font-size:10px; color:#ff0055; margin-top:10px;">[ PURGE API KEY ]</div>
    </div>

    <div id="ai-terminal">
        <div id="chat-log">> WAITING FOR SECURE LINK...</div>
    </div>

    <script id="vShader" type="x-shader/x-vertex">
        uniform float uTime; uniform float uAudio; varying vec3 vColor;
        void main() {
            vec3 pos = position; float angle = uTime * 0.2 + length(pos.xz) * 0.05;
            float s = sin(angle); float c = cos(angle); pos.xz *= mat2(c, -s, s, c);
            pos.y += sin(uTime + pos.x) * uAudio * 3.0;
            vColor = vec3(0.0, 0.3, 0.4); // Vortex de fond plus sombre
            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (2.0 + uAudio * 2.0) * (200.0 / -mvPos.z);
            gl_Position = projectionMatrix * mvPos;
        }
    </script>
    <script id="fShader" type="x-shader/x-fragment">
        varying vec3 vColor; void main() { if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard; gl_FragColor = vec4(vColor, 0.4); }
    </script>

    <script>
        let scene, camera, renderer, backgroundVortex;
        let paintGroup; // Groupe contenant tous les traits de peinture
        let currentBrushColorHex = 0x00f2ff;
        let isPinching = false;
        
        // Dictionnaire des couleurs vocales
        const colorDictionary = {
            'rose': 0xff00ff, 'rouge': 0xff0000, 'bleu': 0x0088ff, 'vert': 0x00ff00,
            'jaune': 0xffff00, 'violet': 0xbd00ff, 'orange': 0xffaa00, 'blanc': 0xffffff,
            'cyan': 0x00f2ff, 'or': 0xffd700, 'magenta': 0xff00aa
        };

        // --- INITIALISATION THREE.JS ---
        function initThree() {
            scene = new THREE.Scene(); 
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight); 
            document.body.appendChild(renderer.domElement);

            // Le Vortex de fond (Plus discret pour laisser place à la peinture)
            const geo = new THREE.BufferGeometry(); const pos = new Float32Array(15000);
            for(let i=0; i<15000; i++) pos[i] = (Math.random()-0.5) * 150;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: {value: 0}, uAudio: {value: 0} },
                vertexShader: document.getElementById('vShader').textContent, fragmentShader: document.getElementById('fShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthTest: false
            });
            backgroundVortex = new THREE.Points(geo, mat); scene.add(backgroundVortex);

            // Groupe de Peinture
            paintGroup = new THREE.Group();
            scene.add(paintGroup);

            camera.position.z = 80;
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
            animateThree();
        }

        function animateThree(t) {
            requestAnimationFrame(animateThree);
            let time = (t || 0) * 0.001;
            backgroundVortex.material.uniforms.uTime.value = time;
            
            // Rotation très lente de la peinture pour l'effet "Atelier 3D"
            paintGroup.rotation.y += 0.002;
            
            renderer.render(scene, camera);
        }

        // --- LE MOTEUR DE PEINTURE (MEDIA PIPE HANDS) ---
        const videoElement = document.querySelector('.input_video');
        
        function drawPaintStroke(x, y) {
            // Conversion des coordonnées normalisées de la main (0 à 1) vers l'espace 3D
            const vector = new THREE.Vector3((x * 2) - 1, -(y * 2) + 1, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z; // Dessiner à Z=0
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));

            // Création de "Particules d'encre"
            const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const material = new THREE.MeshBasicMaterial({ 
                color: currentBrushColorHex, 
                transparent: true, opacity: 0.8, 
                blending: THREE.AdditiveBlending 
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(pos);
            
            // On compense la rotation du groupe pour dessiner là où on pointe vraiment
            mesh.position.applyMatrix4(new THREE.Matrix4().copy(paintGroup.matrixWorld).invert());
            
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            paintGroup.add(mesh);
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Repère 8 = Bout de l'Index. Repère 4 = Bout du Pouce.
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // Calcul de la distance entre le pouce et l'index
                const distance = Math.sqrt(Math.pow(indexTip.x - thumbTip.x, 2) + Math.pow(indexTip.y - thumbTip.y, 2));
                
                // Seuil de pincement (Pinch to draw)
                if (distance < 0.05) {
                    if (!isPinching) isPinching = true;
                    // On dessine en utilisant la position de l'index
                    drawPaintStroke(indexTip.x, indexTip.y);
                } else {
                    isPinching = false;
                }
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onHandResults);

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });

        // --- MODULE VOCAL & COULEURS ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition; let isVoiceMode = false;
        
        function setBrushColor(hex, name) {
            currentBrushColorHex = hex;
            document.getElementById('brush-color-text').innerText = name.toUpperCase();
            document.getElementById('brush-color-text').style.color = '#' + hex.toString(16).padStart(6, '0');
            document.getElementById('brush-color-dot').style.backgroundColor = '#' + hex.toString(16).padStart(6, '0');
            document.getElementById('brush-color-dot').style.color = '#' + hex.toString(16).padStart(6, '0');
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; recognition.lang = 'fr-FR'; recognition.interimResults = false;
            
            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                
                // 1. Peinture Vocale : Changer la couleur si une couleur est prononcée
                let colorChanged = false;
                for (const [colorName, hexValue] of Object.entries(colorDictionary)) {
                    if (transcript.includes(colorName)) {
                        setBrushColor(hexValue, colorName);
                        colorChanged = true;
                        break;
                    }
                }
                
                // 2. Si on dit "Efface", on nettoie la toile
                if (transcript.includes('efface') || transcript.includes('nettoie')) {
                    document.getElementById('clear-paint-btn').click();
                    colorChanged = true;
                }

                // 3. Si ce n'était pas une commande de peinture directe, on l'envoie à Mistral
                if (!colorChanged && mistralApiKey) {
                    askMistral(transcript);
                }
            };
        }

        document.getElementById('voice-btn').addEventListener('click', function() {
            if (!recognition) return;
            isVoiceMode = !isVoiceMode;
            if (isVoiceMode) {
                this.innerText = "[ VOICE LINK : ON ]"; this.style.color = "#ffaa00";
                try { recognition.start(); } catch(e){}
            } else {
                this.innerText = "[ VOICE LINK : OFF ]"; this.style.color = "#00f2ff";
                recognition.stop();
            }
        });

        document.getElementById('clear-paint-btn').addEventListener('click', () => {
            while(paintGroup.children.length > 0){ 
                let child = paintGroup.children[0];
                paintGroup.remove(child); 
                child.geometry.dispose(); child.material.dispose();
            }
        });

        // --- AUTHENTIFICATION & MISTRAL AI ---
        let mistralApiKey = localStorage.getItem('niko_mistral_key') || "";
        const authPanel = document.getElementById('auth-panel'), apiKeyInput = document.getElementById('api-key-input');
        const authBtn = document.getElementById('auth-btn'), chatLog = document.getElementById('chat-log');

        function updateTerminalMsg(htmlContent) { chatLog.innerHTML = htmlContent; chatLog.scrollTop = chatLog.scrollHeight; }

        if (mistralApiKey) { 
            authPanel.style.display = 'none'; 
            updateTerminalMsg("> OPTICS READY. HAND TRACKING ACTIVE. PINCH TO PAINT."); 
            cameraFeed.start(); // Lance la caméra pour les mains
            document.getElementById('status').innerText = "STATUS: TRACKING HANDS";
        }

        authBtn.addEventListener('click', () => {
            if (apiKeyInput.value.trim()) {
                mistralApiKey = apiKeyInput.value.trim(); localStorage.setItem('niko_mistral_key', mistralApiKey);
                authPanel.style.display = 'none'; 
                updateTerminalMsg("> OPTICS READY. HAND TRACKING ACTIVE. PINCH TO PAINT.");
                cameraFeed.start();
                document.getElementById('status').innerText = "STATUS: TRACKING HANDS";
            }
        });

        document.getElementById('reset-key-btn').addEventListener('click', () => { localStorage.removeItem('niko_mistral_key'); location.reload(); });

        async function askMistral(prompt) {
            updateTerminalMsg(`> NIKO: ${prompt}<br>> SYMBIOTE: <span style="color:#ffaa00;">THINKING...</span>`);
            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${mistralApiKey}` },
                    body: JSON.stringify({
                        model: "mistral-small-latest",
                        messages: [
                            {role: "system", content: "Tu es le Symbiote de l'Atelier Neural de l'artiste Niko. L'utilisateur peint en ce moment même dans l'air avec ses doigts en 3D. Réponds à ses réflexions de manière philosophique, artistique et très courte (1 phrase max). Ne propose pas d'actions, réagis juste à son art ou à ses paroles."},
                            {role: "user", content: prompt}
                        ]
                    })
                });
                if (!response.ok) throw new Error("API FAILED");
                const reply = (await response.json()).choices[0].message.content;
                updateTerminalMsg(`> NIKO: ${prompt}<br>> SYMBIOTE: ${reply}`);
                
                // Synthèse vocale de la réponse
                if (window.speechSynthesis) {
                    const u = new SpeechSynthesisUtterance(reply.replace(/[*_~`#]/g, ''));
                    u.lang = 'fr-FR'; u.pitch = 0.8; u.rate = 1.05;
                    window.speechSynthesis.speak(u);
                }
            } catch(e) {
                updateTerminalMsg(`> SYMBIOTE: <span style="color:red;">LINK SEVERED.</span>`);
            }
        }

        initThree();
    </script>
</body>
</html>
